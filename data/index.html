<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Password Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <script src="/crypto-js.min.js"></script>
</head>
<script>
	if (!sessionStorage.getItem("pps_token")) {
		window.location.href = "/login.html";
	}
</script>

<body>
  <div class="top-menu">
      <a href="/settings.html" class="top-button">⚙ Настройки</a>
      <a href="javascript:;" class="top-button" onclick="show_more_menu();">🚪 Выйти</a>
  </div>

  <div class="container">
    <h1>ESP32 Password Manager</h1>

    <div class="form-section">
      <input type="text" id="site" placeholder="Website or Service">
      <input type="text" id="login" placeholder="Login or Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="generatePassword()">Generate</button>
      
      <div id="fieldsContainer">
        <!-- Custom fields will appear here -->
      </div>

      <button onclick="addField()">+ Add Field</button>
      <button onclick="addPassword()">Add Entry</button>
    </div>

    <div class="table-section">
      <h2>Saved Passwords</h2>
      <table id="passwordTable">
		<thead id="passwordHeader"></thead>
		<tbody id="passwordList">
		  <tr><td>Loading…</td></tr>
		</tbody>
	  </table>
    </div>

    <div class="export-import-section">
      <button id="exportPasswords">Export</button>
      <input type="file" id="importPasswords">
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
